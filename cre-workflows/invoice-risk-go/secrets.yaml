# The secret this workflow asks for by name inside the enclave.
#
# It is the platform token that authorizes collecting pending work. The Vault DON releases
# it into the attested enclave and nowhere else: node operators never see it, and neither
# does the Workflow DON.
secretsNames:
    PLATFORM_TOKEN:
        - FF_CONFIDENTIAL_TOKEN
    # The document key. In production this is released per document, by the reference the
    # platform stores beside the ciphertext; the demo seeds one document and one key.
    DOCUMENT_KEY:
        - FF_CONFIDENTIAL_DOCUMENT_KEY
